name: Release Extension

on:
  release:
    types: [published]

permissions:
  contents: write
  actions: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Extract version from tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        VERSION=${VERSION#v}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"

    # The marketplace takes the extension's version from package.json at the
    # moment vsce packages it, so the file must already carry the version of
    # this release before anything is built or published. Bump it on the
    # default branch first, push the commit, and only then run the rest of
    # the release process against that state.
    - name: Check out the default branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.repository.default_branch }}
        # Full history, so the rebase below has something to rebase onto.
        fetch-depth: 0

    - name: Bump the version on the default branch
      id: bump_version
      env:
        BRANCH: ${{ github.event.repository.default_branch }}
        TARGET: ${{ steps.get_version.outputs.VERSION }}
      run: |
        set -euo pipefail
        CURRENT=$(node -p "require('./package.json').version")
        echo "$BRANCH is at $CURRENT; this release is $TARGET"

        if [ "$CURRENT" = "$TARGET" ]; then
          echo "bumped=false" >> $GITHUB_OUTPUT
          echo "Version is already $TARGET; nothing to bump."
          exit 0
        fi

        # A release cut from a maintenance branch must not walk the default
        # branch backwards. Compares the numeric triple only: an equal core
        # still writes, so 1.0.0-rc.1 -> 1.0.0 is recorded.
        if ! node -e '
          const [a, b] = process.argv.slice(1).map(v =>
            v.split("-")[0].split(".").map(Number)
          );
          for (let i = 0; i < 3; i++) {
            if ((a[i] || 0) !== (b[i] || 0)) process.exit((b[i] || 0) > (a[i] || 0) ? 0 : 1);
          }
          process.exit(0);
        ' "$CURRENT" "$TARGET"; then
          echo "bumped=false" >> $GITHUB_OUTPUT
          echo "::warning::$TARGET is older than $CURRENT on $BRANCH; leaving it alone."
          exit 0
        fi

        npm version "$TARGET" --no-git-tag-version

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add package.json package-lock.json
        git commit -m "chore(release): v$TARGET"

        # Someone may have pushed while the bump was being prepared.
        git pull --rebase origin "$BRANCH"
        git push origin "HEAD:$BRANCH"
        echo "bumped=true" >> $GITHUB_OUTPUT

    # A maintenance release bumps nothing on the default branch (it already
    # moved past it), so its build has to come from the tag itself. Every other
    # release builds from the default branch head, which now carries this
    # release's version in package.json.
    - name: Check out the release source
      if: steps.bump_version.outputs.bumped != 'true'
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Compile extension
      run: npm run compile

    - name: Install vsce (VS Code Extension CLI)
      run: npm install -g @vscode/vsce

    # When the build source is the tag, its package.json still holds the
    # previous version, so patch it in the build tree. On the bumped default
    # branch this is already a no-op.
    - name: Update package.json version to match tag
      run: |
        CURRENT_VERSION=$(node -p "require('./package.json').version")
        TARGET_VERSION=${{ steps.get_version.outputs.VERSION }}
        echo "Current version: $CURRENT_VERSION"
        echo "Target version: $TARGET_VERSION"
        if [ "$CURRENT_VERSION" != "$TARGET_VERSION" ]; then
          npm version "$TARGET_VERSION" --no-git-tag-version
          echo "Version updated from $CURRENT_VERSION to $TARGET_VERSION"
        else
          echo "Version is already $TARGET_VERSION, skipping update"
        fi

    # Fail the job instead of shipping a package whose version does not match
    # the release: the marketplace would end up on the previous version.
    - name: Verify the package version matches the release
      run: |
        PACKAGE_VERSION=$(node -p "require('./package.json').version")
        if [ "$PACKAGE_VERSION" != "${{ steps.get_version.outputs.VERSION }}" ]; then
          echo "::error::package.json is at $PACKAGE_VERSION, but the release is ${{ steps.get_version.outputs.VERSION }}"
          exit 1
        fi
        echo "package.json version ${{ steps.get_version.outputs.VERSION }} matches the release"

    - name: Package extension
      env:
        VSCE_PAT: ${{ secrets.AZURE_TOKEN }}
      run: vsce package --out jsonbro-${{ steps.get_version.outputs.VERSION }}.vsix

    - name: Publish to VS Code Marketplace
      env:
        VSCE_PAT: ${{ secrets.AZURE_TOKEN }}
      run: vsce publish --pat "$VSCE_PAT" --skip-duplicate

    # A second copy under a name that does not carry the version, so that
    # https://github.com/<owner>/<repo>/releases/latest/download/jsonbro-latest.vsix
    # resolves. GitHub will serve a file from whichever release is marked
    # latest, but only by an exact name, and jsonbro-<version>.vsix has a
    # different one every time. The README links to that URL.
    - name: Copy the package to a version-less name
      run: cp jsonbro-${{ steps.get_version.outputs.VERSION }}.vsix jsonbro-latest.vsix

    # Two checksum files rather than one: sha256sum writes the name it read
    # into the file, so a single one would not verify against the copy.
    - name: Create checksums
      run: |
        sha256sum jsonbro-${{ steps.get_version.outputs.VERSION }}.vsix > jsonbro-${{ steps.get_version.outputs.VERSION }}.vsix.sha256
        sha256sum jsonbro-latest.vsix > jsonbro-latest.vsix.sha256
        cat jsonbro-${{ steps.get_version.outputs.VERSION }}.vsix.sha256
        cat jsonbro-latest.vsix.sha256

    # --clobber so re-running a release that partly succeeded replaces the
    # assets instead of failing on the ones already uploaded.
    - name: Upload VSIX and checksum to release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload ${{ github.ref_name }} --clobber \
          jsonbro-${{ steps.get_version.outputs.VERSION }}.vsix \
          jsonbro-${{ steps.get_version.outputs.VERSION }}.vsix.sha256 \
          jsonbro-latest.vsix \
          jsonbro-latest.vsix.sha256

    - name: Store build artifacts
      uses: actions/upload-artifact@v4
      with:
        # The versioned pair only; the copy is the same bytes under another
        # name, and keeping both would double the artifact for 90 days.
        name: extension-package-${{ steps.get_version.outputs.VERSION }}
        path: |
          jsonbro-${{ steps.get_version.outputs.VERSION }}.vsix
          jsonbro-${{ steps.get_version.outputs.VERSION }}.vsix.sha256
        retention-days: 90
